name: PR

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/restaurant-frontend-app/**"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    steps: 
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/restaurant-frontend-app/.nvmrc
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
      
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check app
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Type-check specs
        run: npx tsc -p tsconfig.spec.json --noEmit

      - name: Production build
        run: npm run build
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}